<!DOCTYPE html>
<html lang="zh-CN" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>互动游戏中心 - ai-small.xyz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { brand: { 500: '#6366f1', 600: '#4f46e5' } }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen relative flex flex-col antialiased">
    <canvas id="particleCanvas" class="fixed inset-0 pointer-events-none z-0"></canvas>

    <header class="sticky top-0 z-50 glass-nav border-b border-slate-200/50 dark:border-slate-800/50">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <a href="/" class="flex items-center space-x-2 text-slate-600 dark:text-slate-300 hover:text-brand-500 font-bold">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                <span>返回首页</span>
            </a>
            <h1 class="font-extrabold text-lg">🎮 互动游戏中心 (免登录畅玩)</h1>
            <div class="text-xs font-bold text-slate-500">已载入模块化开放架构</div>
        </div>
    </header>

    <main class="relative z-10 max-w-7xl mx-auto px-4 py-10 flex-1">
        <div class="mb-8">
            <h2 class="text-2xl font-black mb-2">大厅游戏列表</h2>
            <p class="text-sm text-slate-500">点击任意小游戏即可启动游戏窗口</p>
        </div>

        <div id="gamesGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            </div>

        <div id="gameModal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md hidden flex items-center justify-center p-4">
            <div class="glass-card w-full max-w-2xl rounded-3xl p-6 relative flex flex-col items-center">
                <button onclick="closeGameModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white font-bold text-xl">✕</button>
                <h3 id="modalGameTitle" class="text-xl font-bold mb-4">游戏标题</h3>
                <div id="gameContainer" class="w-full flex justify-center mb-4">
                    </div>
            </div>
        </div>
    </main>

    <script src="config.js"></script>
    <script src="particles.js"></script>
    <script>
        /**
         * =========================================================================
         * 【开放式小游戏扩展注册端口 (GAMES_REGISTRY)】
         * 后续若需要自由增加小游戏，只需：
         * 1. 将编写好的游戏 .js 文件传到 GitHub ai-small-frontend 仓库 (如 games/mygame.js)
         * 2. 在下方 GAMES_REGISTRY 数组中 append 一条游戏配置对象即可！
         * =========================================================================
         */
        window.GAMES_REGISTRY = [
            {
                id: 'snake',
                name: '经典贪吃蛇',
                icon: '🐍',
                desc: '方向键控制蛇的移动，吃掉食物获得高分！',
                init: function(container) {
                    container.innerHTML = '<canvas id="gameCanvas" width="400" height="400"></canvas>';
                    startSnakeGame();
                }
            }
        ];

        // 渲染游戏列表网格
        function renderGamesList() {
            const grid = document.getElementById('gamesGrid');
            grid.innerHTML = '';

            window.GAMES_REGISTRY.forEach(game => {
                const card = document.createElement('div');
                card.className = 'glass-card p-6 rounded-2xl game-card cursor-pointer border border-white/50 dark:border-slate-800 flex flex-col justify-between';
                card.onclick = () => openGame(game);
                card.innerHTML = `
                    <div>
                        <div class="text-4xl mb-3">${game.icon}</div>
                        <h3 class="text-lg font-bold mb-2">${game.name}</h3>
                        <p class="text-xs text-slate-500">${game.desc}</p>
                    </div>
                    <button class="mt-6 w-full py-2 bg-brand-500/10 hover:bg-brand-500/20 text-brand-500 font-bold rounded-xl text-sm transition-colors">
                        开始游戏
                    </button>
                `;
                grid.appendChild(card);
            });
        }

        function openGame(game) {
            document.getElementById('modalGameTitle').textContent = game.name;
            document.getElementById('gameModal').classList.remove('hidden');
            const container = document.getElementById('gameContainer');
            game.init(container);
        }

        function closeGameModal() {
            document.getElementById('gameModal').classList.add('hidden');
            document.getElementById('gameContainer').innerHTML = '';
        }

        // 示例内置小游戏：贪吃蛇
        function startSnakeGame() {
            const canvas = document.getElementById('gameCanvas');
            if(!canvas) return;
            const ctx = canvas.getContext('2d');
            let snake = [{x: 10, y: 10}];
            let food = {x: 15, y: 15};
            let dx = 1, dy = 0;
            let score = 0;

            function draw() {
                ctx.fillStyle = '#0f172a';
                ctx.fillRect(0, 0, 400, 400);

                // 画食物
                ctx.fillStyle = '#ef4444';
                ctx.fillRect(food.x * 20, food.y * 20, 18, 18);

                // 画蛇
                ctx.fillStyle = '#10b981';
                snake.forEach(part => ctx.fillRect(part.x * 20, part.y * 20, 18, 18));

                // 移动
                let head = {x: snake[0].x + dx, y: snake[0].y + dy};
                if(head.x === food.x && head.y === food.y) {
                    score += 10;
                    food = {Math: Math.floor(Math.random()*20), y: Math.floor(Math.random()*20)};
                } else {
                    snake.pop();
                }

                if(head.x < 0 || head.x >= 20 || head.y < 0 || head.y >= 20) return; // 撞墙停止
                snake.unshift(head);
            }

            const timer = setInterval(draw, 150);

            document.onkeydown = (e) => {
                if(e.key === 'ArrowUp' && dy !== 1) { dx = 0; dy = -1; }
                if(e.key === 'ArrowDown' && dy !== -1) { dx = 0; dy = 1; }
                if(e.key === 'ArrowLeft' && dx !== 1) { dx = -1; dy = 0; }
                if(e.key === 'ArrowRight' && dx !== -1) { dx = 1; dy = 0; }
            };
        }

        document.addEventListener('DOMContentLoaded', renderGamesList);
    </script>
</body>
</html>
