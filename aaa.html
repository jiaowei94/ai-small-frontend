<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 智能对话工作室 - AI-Small</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans relative overflow-x-hidden">

    <canvas id="particleCanvas"></canvas>

    <header class="sticky top-0 z-40 glass-nav border-b border-slate-800/60 px-6 py-4 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <a href="/" class="p-2 rounded-xl bg-slate-800/60 hover:bg-slate-700/60 text-slate-300 transition">
                <i class="fa-solid fa-house text-sm"></i>
            </a>
            <h1 class="text-lg font-bold bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent">
                AI 智能对话工作室
            </h1>
        </div>
        <div class="flex items-center space-x-3">
            <button id="toggleSidebarBtn" class="text-xs px-3 py-1.5 rounded-lg bg-cyan-500/20 text-cyan-300 border border-cyan-500/30 hover:bg-cyan-500/30 transition flex items-center gap-1.5">
                <i class="fa-solid fa-sliders"></i>
                <span>模型与 Key 设置</span>
            </button>
        </div>
    </header>

    <div class="flex-1 flex max-w-7xl w-full mx-auto p-4 gap-4 z-10 relative">

        <aside id="configSidebar" class="w-80 glass-card p-5 rounded-2xl flex flex-col gap-4 border border-slate-800/80 shrink-0">
            <h2 class="text-sm font-semibold text-slate-200 flex items-center gap-2 border-b border-slate-800 pb-3">
                <i class="fa-solid fa-gear text-cyan-400"></i> API & 模型配置
            </h2>

            <div>
                <label class="text-xs text-slate-400 block mb-1 font-medium">Google API Key</label>
                <input type="password" id="apiKeyInput" placeholder="贴入 AIzaSy... 密钥 (可选)" 
                       class="w-full px-3 py-2 rounded-xl bg-slate-900/80 border border-slate-700/70 text-xs text-slate-100 focus:outline-none focus:border-cyan-500 transition">
                <p class="text-[10px] text-slate-500 mt-1">留空则自动使用系统环境变量配置的默认 Key</p>
            </div>

            <div>
                <label class="text-xs text-slate-400 block mb-1 font-medium">选择/填写 Gemini 模型</label>
                <select id="modelSelect" class="w-full px-3 py-2 rounded-xl bg-slate-900/80 border border-slate-700/70 text-xs text-slate-100 focus:outline-none focus:border-cyan-500 transition mb-2" onchange="handleModelSelectChange(this)">
                    <option value="gemini-1.5-flash" selected>gemini-1.5-flash (强烈推荐/额度稳定)</option>
                    <option value="gemini-2.0-flash">gemini-2.0-flash (最新高速版)</option>
                    <option value="gemini-2.0-flash-lite">gemini-2.0-flash-lite (极速轻量版)</option>
                    <option value="gemini-1.5-pro">gemini-1.5-pro (复杂推理版)</option>
                    <option value="custom">✍️ 自定义模型名称 (手动输入)</option>
                </select>

                <div id="customModelWrapper" class="hidden">
                    <input type="text" id="customModelInput" placeholder="输入模型名称 (如 gemini-2.5-flash)" 
                           class="w-full px-3 py-2 rounded-xl bg-slate-900/90 border border-cyan-500/60 text-xs text-cyan-300 focus:outline-none transition">
                </div>
            </div>

            <div class="mt-auto p-3 rounded-xl bg-cyan-950/30 border border-cyan-800/40 text-[11px] text-cyan-300/80 leading-relaxed">
                <i class="fa-solid fa-circle-info mr-1 text-cyan-400"></i>
                若遇到 429/Limit:0 提示，通常是因为免费层对 2.0-flash 做了受限，请直接切回 <b>gemini-1.5-flash</b> 即可正常使用。
            </div>
        </aside>

        <main class="flex-1 glass-card rounded-2xl flex flex-col overflow-hidden border border-slate-800/80">
            
            <div id="chatHistory" class="flex-1 p-6 overflow-y-auto space-y-4 text-sm">
                <div class="flex items-start gap-3">
                    <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center shrink-0 shadow-lg">
                        <i class="fa-solid fa-robot text-xs text-white"></i>
                    </div>
                    <div class="glass-card p-4 rounded-2xl rounded-tl-none max-w-[85%] text-slate-200 border border-slate-700/50 leading-relaxed">
                        你好！我是 AI-Small 助手。我已经准备就绪，请在下方输入你的问题，我们可以开始对话了。
                    </div>
                </div>
            </div>

            <div id="statusNotice" class="hidden px-6 py-2 bg-amber-500/10 border-t border-amber-500/20 text-amber-300 text-xs flex items-center justify-between">
                <span id="statusNoticeText"></span>
                <button onclick="document.getElementById('statusNotice').classList.add('hidden')" class="text-amber-400 hover:text-amber-200">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <form id="chatForm" onsubmit="sendMessage(event)" class="p-4 border-t border-slate-800/80 bg-slate-950/40 flex items-center gap-3">
                <input type="text" id="userInput" placeholder="输入消息内容..." 
                       class="flex-1 px-4 py-3 rounded-xl bg-slate-900/90 border border-slate-700/80 text-sm text-slate-100 focus:outline-none focus:border-cyan-500 transition placeholder:text-slate-500">
                <button type="submit" id="sendBtn" 
                        class="px-5 py-3 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-medium text-sm transition shadow-lg flex items-center gap-2 shrink-0">
                    <span>发送</span>
                    <i class="fa-solid fa-paper-plane text-xs"></i>
                </button>
            </form>
        </main>
    </div>

    <script src="config.js"></script>
    <script src="particles.js"></script>
    <script>
        let chatLogs = [];

        // 切换自定义模型输入框
        function handleModelSelectChange(selectElem) {
            const wrapper = document.getElementById('customModelWrapper');
            if (selectElem.value === 'custom') {
                wrapper.classList.remove('hidden');
            } else {
                wrapper.classList.add('hidden');
            }
        }

        // 获取当前选中的模型名称
        function getSelectedModel() {
            const selectElem = document.getElementById('modelSelect');
            if (selectElem.value === 'custom') {
                const customVal = document.getElementById('customModelInput').value.trim();
                return customVal || 'gemini-1.5-flash';
            }
            return selectElem.value;
        }

        async function sendMessage(e) {
            e.preventDefault();
            const inputElem = document.getElementById('userInput');
            const message = inputElem.value.trim();
            if (!message) return;

            const apiKey = document.getElementById('apiKeyInput').value.trim();
            const selectedModel = getSelectedModel();

            // 渲染用户消息
            appendMessage('user', message);
            inputElem.value = '';

            // 禁用发送按钮
            const sendBtn = document.getElementById('sendBtn');
            sendBtn.disabled = true;
            sendBtn.classList.add('opacity-50');

            // 渲染 Loading 占位
            const loadingId = appendLoading();

            try {
                const response = await fetch(`${CONFIG.API_BASE_URL}/api/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message,
                        history: chatLogs,
                        apiKey: apiKey || undefined,
                        model: selectedModel
                    })
                });

                const data = await response.json();
                removeMessage(loadingId);

                if (data.success) {
                    appendMessage('ai', data.reply);
                    chatLogs.push({ role: 'user', content: message });
                    chatLogs.push({ role: 'ai', content: data.reply });

                    // 显示降级或系统提醒（若有）
                    if (data.notice) {
                        showNotice(data.notice);
                    }
                } else {
                    appendMessage('ai', `⚠️ ${data.message || '请求服务发生异常'}`);
                }
            } catch (err) {
                removeMessage(loadingId);
                appendMessage('ai', `❌ 网络请求失败: ${err.message}`);
            } finally {
                sendBtn.disabled = false;
                sendBtn.classList.remove('opacity-50');
            }
        }

        function appendMessage(role, content) {
            const historyContainer = document.getElementById('chatHistory');
            const msgId = 'msg_' + Date.now();
            const isUser = role === 'user';

            const html = `
                <div id="${msgId}" class="flex items-start gap-3 ${isUser ? 'flex-row-reverse' : ''}">
                    <div class="w-8 h-8 rounded-xl ${isUser ? 'bg-blue-600' : 'bg-gradient-to-tr from-cyan-500 to-blue-600'} flex items-center justify-center shrink-0 shadow-lg">
                        <i class="fa-solid ${isUser ? 'fa-user' : 'fa-robot'} text-xs text-white"></i>
                    </div>
                    <div class="glass-card p-4 rounded-2xl ${isUser ? 'rounded-tr-none bg-blue-600/20 border-blue-500/30' : 'rounded-tl-none border-slate-700/50'} max-w-[85%] text-slate-100 leading-relaxed whitespace-pre-wrap">
                        ${content}
                    </div>
                </div>
            `;
            historyContainer.insertAdjacentHTML('beforeend', html);
            historyContainer.scrollTop = historyContainer.scrollHeight;
            return msgId;
        }

        function appendLoading() {
            const historyContainer = document.getElementById('chatHistory');
            const msgId = 'msg_loading_' + Date.now();

            const html = `
                <div id="${msgId}" class="flex items-start gap-3">
                    <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center shrink-0 shadow-lg">
                        <i class="fa-solid fa-spinner fa-spin text-xs text-white"></i>
                    </div>
                    <div class="glass-card p-4 rounded-2xl rounded-tl-none text-slate-400 text-xs flex items-center gap-2 border border-slate-800">
                        <span>AI 思考中...</span>
                    </div>
                </div>
            `;
            historyContainer.insertAdjacentHTML('beforeend', html);
            historyContainer.scrollTop = historyContainer.scrollHeight;
            return msgId;
        }

        function removeMessage(id) {
            const elem = document.getElementById(id);
            if (elem) elem.remove();
        }

        function showNotice(text) {
            const noticeBox = document.getElementById('statusNotice');
            const noticeText = document.getElementById('statusNoticeText');
            noticeText.textContent = text;
            noticeBox.classList.remove('hidden');
        }

        // 控制面板移动端显隐
        document.getElementById('toggleSidebarBtn').addEventListener('click', () => {
            const sidebar = document.getElementById('configSidebar');
            sidebar.classList.toggle('hidden');
        });
    </script>
</body>
</html>
