<!DOCTYPE html>
<html lang="zh-CN" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>免登录 AI 聊天助手 - ai-small.xyz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#eef2ff', 500: '#6366f1', 600: '#4f46e5' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen relative flex flex-col antialiased">
    <canvas id="particleCanvas" class="fixed inset-0 pointer-events-none z-0"></canvas>

    <header class="sticky top-0 z-50 glass-nav border-b border-slate-200/50 dark:border-slate-800/50">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
            <a href="/" class="flex items-center space-x-2 text-slate-600 dark:text-slate-300 hover:text-brand-500 font-bold">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                <span>返回首页</span>
            </a>
            <div class="flex items-center space-x-3">
                <span class="px-3 py-1 rounded-full bg-blue-500/10 text-blue-500 text-xs font-bold">🤖 Gemini Flash 免登录版</span>
            </div>
        </div>
    </header>

    <main class="relative z-10 flex-1 max-w-4xl w-full mx-auto p-4 flex flex-col">
        <div class="glass-card rounded-3xl p-6 flex-1 flex flex-col shadow-2xl border border-white/50 dark:border-slate-800">
            <div id="chatBox" class="flex-1 overflow-y-auto pr-2 space-y-4 mb-4" style="max-height: calc(100vh - 240px);">
                <div class="chat-message-item chat-message-ai">
                    👋 你好！我是免登录 AI 助手。基于 Google Gemini 引擎驱动，有什么我可以帮你的？
                </div>
            </div>

            <form id="chatForm" onsubmit="sendChatMessage(event)" class="flex gap-3">
                <input type="text" id="chatInput" placeholder="请输入你的问题或提示词..." required class="flex-1 px-5 py-4 rounded-2xl bg-slate-100/90 dark:bg-slate-800/90 border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-brand-500 transition-all">
                <button type="submit" id="sendBtn" class="px-6 py-4 bg-gradient-to-r from-brand-600 to-indigo-600 hover:from-brand-500 hover:to-indigo-500 text-white font-bold rounded-2xl shadow-lg shadow-brand-500/20 transition-all flex items-center gap-2">
                    <span>发送</span>
                </button>
            </form>
        </div>
    </main>

    <script src="config.js"></script>
    <script src="particles.js"></script>
    <script>
        async function sendChatMessage(e) {
            e.preventDefault();
            const input = document.getElementById('chatInput');
            const chatBox = document.getElementById('chatBox');
            const sendBtn = document.getElementById('sendBtn');
            const message = input.value.trim();

            if (!message) return;

            // 1. 追加用户消息气泡
            const userBubble = document.createElement('div');
            userBubble.className = 'chat-message-item chat-message-user';
            userBubble.textContent = message;
            chatBox.appendChild(userBubble);

            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            // 2. 追加 AI 思考中占位气泡
            const aiBubble = document.createElement('div');
            aiBubble.className = 'chat-message-item chat-message-ai';
            aiBubble.textContent = '思考中...';
            chatBox.appendChild(aiBubble);
            chatBox.scrollTop = chatBox.scrollHeight;

            sendBtn.disabled = true;

            try {
                // 请求 Vercel 后端 Gemini API
                const res = await fetch(`${CONFIG.API_BASE_URL}/api/ai/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message })
                });
                const data = await res.json();

                if (data.success) {
                    aiBubble.textContent = data.reply;
                } else {
                    aiBubble.textContent = '❌ AI 思考失败：' + (data.message || '系统繁忙');
                }
            } catch (err) {
                console.error(err);
                aiBubble.textContent = '❌ 请求异常，请稍后重试';
            } finally {
                sendBtn.disabled = false;
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        }
    </script>
</body>
</html>
