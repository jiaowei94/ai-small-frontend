<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini AI 对话空间 - ai-small.xyz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        gemini: {
                            bg: '#131314',
                            sidebar: '#1e1f20',
                            card: '#1e1f20',
                            input: '#282a2c'
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gemini-bg text-slate-100 min-h-screen flex relative overflow-hidden font-sans">

    <canvas id="particleCanvas" style="position:fixed; top:0; left:0; width:100vw; height:100vh; pointer-events:none; z-index:0; opacity:0.5;"></canvas>

    <aside id="sidebar" class="w-64 bg-gemini-sidebar flex-col justify-between border-r border-slate-800/60 z-20 transition-all duration-300 flex shrink-0">
        <div class="p-4">
            <div class="flex items-center justify-between mb-6">
                <a href="/" class="flex items-center space-x-2">
                    <i class="fa-solid fa-sparkles text-cyan-400 text-lg"></i>
                    <span class="font-bold text-base text-white tracking-wide">ai-small Gemini</span>
                </a>
                <a href="/" title="返回首页" class="text-slate-400 hover:text-white text-sm">
                    <i class="fa-solid fa-house"></i>
                </a>
            </div>

            <button onclick="startNewChat()" class="w-full py-3 px-4 rounded-full bg-slate-800/80 hover:bg-slate-700/80 border border-slate-700 text-xs font-semibold flex items-center space-x-3 text-slate-200 transition-colors shadow-sm">
                <i class="fa-solid fa-plus text-cyan-400"></i>
                <span>发起新对话</span>
            </button>

            <div class="mt-6 p-3 bg-slate-900/80 rounded-2xl border border-slate-800 text-xs space-y-2">
                <div class="flex items-center justify-between text-slate-400 font-bold text-[11px]">
                    <span><i class="fa-solid fa-key text-amber-400 mr-1"></i>Google API Key</span>
                    <span id="keyStatus" class="text-emerald-400">默认后端</span>
                </div>
                <input type="password" id="customApiKey" placeholder="可选: 贴入 AI Studio Key" onchange="saveCustomKey()"
                    class="w-full px-2.5 py-1.5 rounded-lg bg-slate-800 border border-slate-700 text-[11px] text-white focus:outline-none focus:border-cyan-500">
                <p class="text-[10px] text-slate-500">留空则默认使用 Vercel 云端配置密钥</p>
            </div>
        </div>

        <div class="p-4 border-t border-slate-800/80 text-xs text-slate-500 flex items-center justify-between">
            <span>支持免登录体验</span>
            <a href="/" class="text-cyan-400 hover:underline">主站首页</a>
        </div>
    </aside>

    <main class="flex-1 flex flex-col h-screen z-10 relative overflow-hidden">
        
        <header class="h-14 border-b border-slate-800/50 px-6 flex items-center justify-between bg-gemini-bg/80 backdrop-blur-md">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-wand-magic-sparkles text-cyan-400"></i>
                <select id="modelSelect" class="bg-slate-800/80 text-slate-200 text-xs font-semibold rounded-lg px-3 py-1.5 border border-slate-700 focus:outline-none focus:ring-1 focus:ring-cyan-500">
                    <option value="gemini-2.0-flash">Gemini 2.0 Flash (默认 - 极速推荐)</option>
                    <option value="gemini-1.5-pro">Gemini 1.5 Pro (深度推理)</option>
                    <option value="gemini-1.5-flash">Gemini 1.5 Flash (轻量快答)</option>
                </select>
            </div>
            <div class="text-xs text-slate-400 flex items-center space-x-2">
                <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
                <span>Gemini API Ready</span>
            </div>
        </header>

        <div id="chatContainer" class="flex-1 overflow-y-auto p-4 md:p-8 space-y-6 max-w-4xl mx-auto w-full">
            <div id="welcomeCard" class="my-12 text-center space-y-6">
                <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-cyan-500 to-indigo-600 flex items-center justify-center text-3xl mx-auto shadow-xl shadow-cyan-500/20">
                    <i class="fa-solid fa-sparkles text-white"></i>
                </div>
                <div>
                    <h2 class="text-2xl font-bold text-white tracking-tight">你好，我是 ai-small AI 助手</h2>
                    <p class="text-xs text-slate-400 mt-2">基于 Google Gemini 全系大模型驱动，随意向我提问吧！</p>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-3 max-w-2xl mx-auto text-left pt-4">
                    <div onclick="quickSend('用 Python 编写一段高效的快速排序算法，并带有详细注释')" class="p-4 rounded-2xl bg-gemini-card hover:bg-slate-800 border border-slate-800/80 cursor-pointer transition-all">
                        <i class="fa-solid fa-code text-cyan-400 mb-2"></i>
                        <h4 class="text-xs font-bold text-white">分析与编写代码</h4>
                        <p class="text-[11px] text-slate-400 mt-1">生成高效 Python/JS/Go 代码</p>
                    </div>
                    <div onclick="quickSend('请帮我撰写一份关于 AI 协同平台的宣传邮件模板')" class="p-4 rounded-2xl bg-gemini-card hover:bg-slate-800 border border-slate-800/80 cursor-pointer transition-all">
                        <i class="fa-solid fa-pen-nib text-purple-400 mb-2"></i>
                        <h4 class="text-xs font-bold text-white">撰写文本与方案</h4>
                        <p class="text-[11px] text-slate-400 mt-1">定制专业文案与商务沟通内容</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="p-4 md:pb-6 max-w-4xl mx-auto w-full">
            <div class="bg-gemini-input rounded-3xl p-3 border border-slate-700/60 shadow-2xl relative">
                <textarea id="userInput" rows="2" placeholder="输入你想问的问题..."
                    class="w-full bg-transparent text-sm text-white placeholder-slate-400 focus:outline-none resize-none px-3 pt-1"></textarea>
                
                <div class="flex items-center justify-between pt-2 px-2 border-t border-slate-800/60">
                    <div class="text-[11px] text-slate-500">
                        Shift + Enter 换行
                    </div>
                    <button id="sendBtn" onclick="sendMessage()" class="px-4 py-2 rounded-full bg-white text-slate-900 font-bold text-xs hover:bg-slate-200 transition-all flex items-center space-x-1">
                        <span>发送</span>
                        <i class="fa-solid fa-paper-plane text-[10px]"></i>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script src="config.js"></script>
    <script src="particles.js"></script>
    <script>
        let chatHistory = [];

        // 初始化读取本地 Custom Key
        document.addEventListener('DOMContentLoaded', () => {
            const savedKey = localStorage.getItem('user_gemini_key');
            if (savedKey) {
                document.getElementById('customApiKey').value = savedKey;
                document.getElementById('keyStatus').textContent = '使用自定义Key';
                document.getElementById('keyStatus').className = 'text-cyan-400';
            }
        });

        function saveCustomKey() {
            const val = document.getElementById('customApiKey').value.trim();
            if (val) {
                localStorage.setItem('user_gemini_key', val);
                document.getElementById('keyStatus').textContent = '使用自定义Key';
                document.getElementById('keyStatus').className = 'text-cyan-400';
            } else {
                localStorage.removeItem('user_gemini_key');
                document.getElementById('keyStatus').textContent = '默认后端';
                document.getElementById('keyStatus').className = 'text-emerald-400';
            }
        }

        function quickSend(text) {
            document.getElementById('userInput').value = text;
            sendMessage();
        }

        function startNewChat() {
            chatHistory = [];
            document.getElementById('chatContainer').innerHTML = `
                <div id="welcomeCard" class="my-12 text-center space-y-6">
                    <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-cyan-500 to-indigo-600 flex items-center justify-center text-3xl mx-auto shadow-xl">
                        <i class="fa-solid fa-sparkles text-white"></i>
                    </div>
                    <div>
                        <h2 class="text-2xl font-bold text-white">新对话已建立</h2>
                        <p class="text-xs text-slate-400 mt-2">随时问我任何问题</p>
                    </div>
                </div>`;
        }

        async function sendMessage() {
            const inputEl = document.getElementById('userInput');
            const prompt = inputEl.value.trim();
            if (!prompt) return;

            const welcomeCard = document.getElementById('welcomeCard');
            if (welcomeCard) welcomeCard.remove();

            const model = document.getElementById('modelSelect').value;
            const customKey = localStorage.getItem('user_gemini_key') || '';

            appendMessage('user', prompt);
            inputEl.value = '';

            const loadingId = 'loading-' + Date.now();
            appendLoading(loadingId);

            try {
                // 请求后端 API，附带自定义 Key（若存在）
                const res = await fetch(`${CONFIG.API_BASE_URL}/api/ai/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        prompt: prompt,
                        model: model,
                        customKey: customKey,
                        history: chatHistory
                    })
                });

                const data = await res.json();
                document.getElementById(loadingId)?.remove();

                if (res.ok && data.success) {
                    appendMessage('ai', data.reply);
                    chatHistory.push({ role: 'user', content: prompt });
                    chatHistory.push({ role: 'model', content: data.reply });
                } else {
                    const errDetail = data.message || '未知错误，请检查网络或 Key 权限';
                    appendMessage('ai', `❌ **请求失败 (${res.status})**：\n\n${errDetail}\n\n💡 *提示：如果是 500 错误，请在左侧侧边栏填入你的 Google AI Studio API Key 试一下！*`);
                }
            } catch (err) {
                document.getElementById(loadingId)?.remove();
                appendMessage('ai', `⚠️ **网络故障**：无法连接到后端服务器 (${CONFIG.API_BASE_URL})\n\n详细信息: ${err.message}`);
            }
        }

        function appendMessage(role, text) {
            const container = document.getElementById('chatContainer');
            const isUser = role === 'user';
            
            const msgHtml = `
                <div class="flex items-start space-x-3 ${isUser ? 'flex-row-reverse space-x-reverse' : ''}">
                    <div class="w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold text-white shrink-0 ${isUser ? 'bg-cyan-600' : 'bg-purple-600'}">
                        ${isUser ? '你' : '<i class="fa-solid fa-sparkles"></i>'}
                    </div>
                    <div class="max-w-[85%] p-4 rounded-2xl text-xs leading-relaxed ${isUser ? 'bg-cyan-600 text-white' : 'bg-gemini-card text-slate-200 border border-slate-800'} shadow-md">
                        <pre class="whitespace-pre-wrap font-sans text-xs">${text}</pre>
                    </div>
                </div>`;
            container.insertAdjacentHTML('beforeend', msgHtml);
            container.scrollTop = container.scrollHeight;
        }

        function appendLoading(id) {
            const container = document.getElementById('chatContainer');
            const loadingHtml = `
                <div id="${id}" class="flex items-center space-x-3">
                    <div class="w-8 h-8 rounded-full bg-purple-600 flex items-center justify-center text-xs text-white">
                        <i class="fa-solid fa-sparkles animate-spin"></i>
                    </div>
                    <div class="bg-gemini-card px-4 py-3 rounded-2xl border border-slate-800 text-xs text-slate-400 flex items-center space-x-2">
                        <span class="animate-pulse">Gemini 思考中...</span>
                    </div>
                </div>`;
            container.insertAdjacentHTML('beforeend', loadingHtml);
            container.scrollTop = container.scrollHeight;
        }

        document.getElementById('userInput')?.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
    </script>
</body>
</html>
