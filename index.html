<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI-Small Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

  <!-- 顶部导航 -->
  <header class="border-b border-slate-800 bg-slate-950/80 backdrop-blur sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <span class="text-2xl font-black bg-gradient-to-r from-blue-400 to-indigo-500 bg-clip-text text-transparent">AI-SMALL</span>
        <span class="text-xs bg-slate-800 text-slate-400 px-2 py-0.5 rounded">v1.1</span>
      </div>
      <div id="nav-user-area" class="flex items-center space-x-4">
        <!-- 未登录/已登录状态由 JS 动态渲染 -->
      </div>
    </div>
  </header>

  <!-- 主要内容区域 -->
  <div class="flex-1 flex max-w-7xl w-full mx-auto px-4 py-6 gap-6">

    <!-- 未登录状态：展示品牌介绍 & 认证表单卡片 -->
    <main id="view-guest" class="w-full grid md:grid-cols-2 gap-8 items-center">
      <!-- 左侧：品牌与功能点介绍 -->
      <div class="space-y-6">
        <h1 class="text-4xl font-extrabold tracking-tight sm:text-5xl">
          免卡高效的 <br/>
          <span class="bg-gradient-to-r from-blue-400 via-indigo-400 to-purple-500 bg-clip-text text-transparent">全栈 AI & 协作平台</span>
        </h1>
        <p class="text-slate-400 text-lg">
          集成了全网最新大模型能力，无缝连接智能对话、多语言实时协作社区、健康膳食分析与高智力 AI 游戏对战。
        </p>
        <div class="grid grid-cols-2 gap-4 pt-4">
          <div class="p-4 bg-slate-800/50 rounded-xl border border-slate-800">
            <div class="font-bold text-blue-400">/aaa 免登录 AI</div>
            <div class="text-xs text-slate-400 mt-1">快速体验大模型能力</div>
          </div>
          <div class="p-4 bg-slate-800/50 rounded-xl border border-slate-800">
            <div class="font-bold text-indigo-400">/ddd 协同社区</div>
            <div class="text-xs text-slate-400 mt-1">实时多语言与频道控制</div>
          </div>
          <div class="p-4 bg-slate-800/50 rounded-xl border border-slate-800">
            <div class="font-bold text-emerald-400">/eee 膳食健康</div>
            <div class="text-xs text-slate-400 mt-1">图像分析卡路里与成分</div>
          </div>
          <div class="p-4 bg-slate-800/50 rounded-xl border border-slate-800">
            <div class="font-bold text-purple-400">/ooo 互动对战</div>
            <div class="text-xs text-slate-400 mt-1">五子棋 AI 与游戏排行榜</div>
          </div>
        </div>
      </div>

      <!-- 右侧： Auth 认证面板 -->
      <div class="bg-slate-800/80 border border-slate-700/60 p-6 rounded-2xl shadow-xl backdrop-blur max-w-md w-full justify-self-center">
        <!-- Tab 切换 -->
        <div class="flex border-b border-slate-700 mb-6">
          <button id="tab-login-btn" onclick="switchTab('login')" class="flex-1 pb-3 font-semibold text-blue-400 border-b-2 border-blue-400">密码登录</button>
          <button id="tab-register-btn" onclick="switchTab('register')" class="flex-1 pb-3 font-semibold text-slate-400 border-b-2 border-transparent">新用户注册</button>
          <button id="tab-reset-btn" onclick="switchTab('reset')" class="flex-1 pb-3 font-semibold text-slate-400 border-b-2 border-transparent">找回密码</button>
        </div>

        <!-- 1. 登录表单 -->
        <form id="form-login" onsubmit="handleLogin(event)" class="space-y-4">
          <div>
            <label class="block text-xs text-slate-400 mb-1">邮箱地址</label>
            <input type="email" id="login-email" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500" placeholder="your@qq.com" />
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1">密码</label>
            <input type="password" id="login-password" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500" placeholder="••••••••" />
          </div>
          <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-2 rounded-lg transition text-sm">立即登录</button>
        </form>

        <!-- 2. 注册表单 (需验证码) -->
        <form id="form-register" onsubmit="handleRegister(event)" class="space-y-4 hidden">
          <div>
            <label class="block text-xs text-slate-400 mb-1">注册邮箱 (支持 QQ 邮箱)</label>
            <input type="email" id="reg-email" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500" placeholder="your@qq.com" />
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1">邮箱验证码</label>
            <div class="flex gap-2">
              <input type="text" id="reg-code" required class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500" placeholder="6位数验证码" />
              <button type="button" id="btn-send-reg-code" onclick="sendCode('register')" class="bg-slate-700 hover:bg-slate-600 text-xs px-3 py-2 rounded-lg whitespace-nowrap">获取验证码</button>
            </div>
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1">昵称 (可选)</label>
            <input type="text" id="reg-nickname" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500" placeholder="极客玩家" />
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1">设置登录密码</label>
            <input type="password" id="reg-password" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500" placeholder="••••••••" />
          </div>
          <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-2 rounded-lg transition text-sm">注册并完成创建</button>
        </form>

        <!-- 3. 找回密码表单 (需验证码) -->
        <form id="form-reset" onsubmit="handleResetPassword(event)" class="space-y-4 hidden">
          <div>
            <label class="block text-xs text-slate-400 mb-1">注册邮箱</label>
            <input type="email" id="reset-email" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500" placeholder="your@qq.com" />
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1">邮箱验证码</label>
            <div class="flex gap-2">
              <input type="text" id="reset-code" required class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500" placeholder="6位数验证码" />
              <button type="button" id="btn-send-reset-code" onclick="sendCode('reset_password')" class="bg-slate-700 hover:bg-slate-600 text-xs px-3 py-2 rounded-lg whitespace-nowrap">获取验证码</button>
            </div>
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1">新密码</label>
            <input type="password" id="reset-new-password" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500" placeholder="输入新密码" />
          </div>
          <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-2 rounded-lg transition text-sm">提交修改</button>
        </form>

        <div id="auth-msg" class="mt-4 text-xs text-center min-h-[1rem]"></div>
      </div>
    </main>

    <!-- 已登录状态：展示侧边栏工作台 -->
    <div id="view-dashboard" class="w-full hidden flex gap-6">
      <aside class="w-64 bg-slate-800/40 border border-slate-800 rounded-2xl p-4 flex flex-col justify-between shrink-0">
        <div class="space-y-2">
          <div class="text-xs font-bold text-slate-500 px-3 uppercase tracking-wider mb-2">功能导航</div>
          <a href="/aaa" class="flex items-center space-x-3 px-3 py-2.5 rounded-xl hover:bg-slate-800 text-slate-300 hover:text-white transition">
            <span>💬</span><span class="text-sm font-medium">/aaa 免登录 AI</span>
          </a>
          <a href="/ddd" class="flex items-center space-x-3 px-3 py-2.5 rounded-xl hover:bg-slate-800 text-slate-300 hover:text-white transition">
            <span>🌐</span><span class="text-sm font-medium">/ddd 协同社区</span>
          </a>
          <a href="/eee" class="flex items-center space-x-3 px-3 py-2.5 rounded-xl hover:bg-slate-800 text-slate-300 hover:text-white transition">
            <span>🥗</span><span class="text-sm font-medium">/eee 膳食识别</span>
          </a>
          <a href="/ooo" class="flex items-center space-x-3 px-3 py-2.5 rounded-xl hover:bg-slate-800 text-slate-300 hover:text-white transition">
            <span>🎮</span><span class="text-sm font-medium">/ooo 互动游戏</span>
          </a>
        </div>

        <div class="p-3 bg-slate-800/80 rounded-xl border border-slate-700/50 flex items-center space-x-3">
          <img id="dash-user-avatar" src="" class="w-9 h-9 rounded-full bg-slate-700" alt="Avatar"/>
          <div class="overflow-hidden flex-1">
            <div id="dash-user-name" class="text-sm font-semibold truncate"></div>
            <div id="dash-user-email" class="text-xs text-slate-400 truncate"></div>
          </div>
        </div>
      </aside>

      <main class="flex-1 bg-slate-800/30 border border-slate-800 rounded-2xl p-8 flex flex-col items-center justify-center text-center">
        <div class="text-5xl mb-4">🚀</div>
        <h2 class="text-2xl font-bold mb-2">欢迎进入 AI-Small 个人工作台</h2>
        <p class="text-slate-400 max-w-md text-sm">登录状态保持中，你可以从左侧菜单无缝切换至各个核心业务模块进行操作。</p>
      </main>
    </div>

  </div>

  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script>
    // Tab 切换控制
    function switchTab(tab) {
      document.getElementById('form-login').classList.toggle('hidden', tab !== 'login');
      document.getElementById('form-register').classList.toggle('hidden', tab !== 'register');
      document.getElementById('form-reset').classList.toggle('hidden', tab !== 'reset');

      document.getElementById('tab-login-btn').className = tab === 'login' ? 'flex-1 pb-3 font-semibold text-blue-400 border-b-2 border-blue-400' : 'flex-1 pb-3 font-semibold text-slate-400 border-b-2 border-transparent';
      document.getElementById('tab-register-btn').className = tab === 'register' ? 'flex-1 pb-3 font-semibold text-blue-400 border-b-2 border-blue-400' : 'flex-1 pb-3 font-semibold text-slate-400 border-b-2 border-transparent';
      document.getElementById('tab-reset-btn').className = tab === 'reset' ? 'flex-1 pb-3 font-semibold text-blue-400 border-b-2 border-blue-400' : 'flex-1 pb-3 font-semibold text-slate-400 border-b-2 border-transparent';
      
      showMsg('');
    }

    function showMsg(msg, isError = false) {
      const el = document.getElementById('auth-msg');
      el.textContent = msg;
      el.className = `mt-4 text-xs text-center min-h-[1rem] ${isError ? 'text-red-400' : 'text-emerald-400'}`;
    }

    // 倒计时流控
    function startCountdown(btnId) {
      const btn = document.getElementById(btnId);
      let sec = 60;
      btn.disabled = true;
      const timer = setInterval(() => {
        sec--;
        btn.textContent = `${sec}s 后重试`;
        if (sec <= 0) {
          clearInterval(timer);
          btn.disabled = false;
          btn.textContent = '获取验证码';
        }
      }, 1000);
    }

    // 发送验证码
    async function sendCode(type) {
      const emailId = type === 'register' ? 'reg-email' : 'reset-email';
      const btnId = type === 'register' ? 'btn-send-reg-code' : 'btn-send-reset-code';
      const email = document.getElementById(emailId).value;

      if (!email) {
        showMsg('请先输入邮箱地址', true);
        return;
      }

      showMsg('验证码发送中...');
      const res = await Auth.sendCode(email, type);
      if (res.success) {
        showMsg(res.message);
        startCountdown(btnId);
      } else {
        showMsg(res.message, true);
      }
    }

    // 注册处理
    async function handleRegister(e) {
      e.preventDefault();
      const email = document.getElementById('reg-email').value;
      const code = document.getElementById('reg-code').value;
      const nickname = document.getElementById('reg-nickname').value;
      const password = document.getElementById('reg-password').value;

      showMsg('正在注册...');
      const res = await Auth.register(email, password, code, nickname);
      if (res.success) {
        showMsg(res.message);
        setTimeout(() => switchTab('login'), 1500);
      } else {
        showMsg(res.message, true);
      }
    }

    // 登录处理
    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;

      showMsg('正在登录...');
      const res = await Auth.login(email, password);
      if (res.success) {
        showMsg('登录成功！正在跳转...');
        renderState();
      } else {
        showMsg(res.message, true);
      }
    }

    // 找回密码处理
    async function handleResetPassword(e) {
      e.preventDefault();
      const email = document.getElementById('reset-email').value;
      const code = document.getElementById('reset-code').value;
      const newPassword = document.getElementById('reset-new-password').value;

      showMsg('正在提交...');
      const res = await Auth.resetPassword(email, code, newPassword);
      if (res.success) {
        showMsg(res.message);
        setTimeout(() => switchTab('login'), 1500);
      } else {
        showMsg(res.message, true);
      }
    }

    // 页面状态渲染与登录切换
    function renderState() {
      const user = Auth.getUser();
      const navArea = document.getElementById('nav-user-area');
      const viewGuest = document.getElementById('view-guest');
      const viewDashboard = document.getElementById('view-dashboard');

      if (user) {
        navArea.innerHTML = `
          <div class="flex items-center space-x-3">
            <span class="text-sm font-medium text-slate-300">${user.nickname || user.email}</span>
            <button onclick="Auth.logout()" class="text-xs bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 px-3 py-1.5 rounded-lg">退出登录</button>
          </div>
        `;
        viewGuest.classList.add('hidden');
        viewDashboard.classList.remove('hidden');

        document.getElementById('dash-user-avatar').src = user.avatar_url || `https://api.dicebear.com/7.x/bottts/svg?seed=${user.id}`;
        document.getElementById('dash-user-name').textContent = user.nickname || '用户';
        document.getElementById('dash-user-email').textContent = user.email;
      } else {
        navArea.innerHTML = `
          <button onclick="switchTab('login')" class="text-xs bg-blue-600 hover:bg-blue-500 text-white font-medium px-4 py-2 rounded-lg">登录 / 注册</button>
        `;
        viewGuest.classList.remove('hidden');
        viewDashboard.classList.add('hidden');
      }
    }

    // 初始化检查
    window.onload = renderState;
  </script>
</body>
</html>
